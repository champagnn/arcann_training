default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.9
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  # Enforce conventional commit messages (needed by `cz bump` for semver).
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.4
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: unittest
        name: Run unit tests
        entry: python -m unittest discover arcann_training/unittests
        language: system
        pass_filenames: false
