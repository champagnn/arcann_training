site_name: ArcanNN - Training
site_url: https://champagnn.github.io/arcann_training/
repo_url: https://github.com/champagnn/arcann_training
repo_name: champagnn/arcann_training
plugins:
    - search
    - awesome-pages
    - markdownextradata
theme:
    name: material
    icon:
        repo: fontawesome/brands/github
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
extra_css:
    - stylesheets/extra.css
extra:
    version:
        # Version selector, populated by mike (versions.json on gh-pages)
        provider: mike
        default: latest
        alias: true
