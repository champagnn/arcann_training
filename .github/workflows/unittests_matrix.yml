name: Unit Tests Matrix

# Feature branches are tested through their PR (pull_request), not on every
# push, so a push to a PR branch runs the suite once. main/develop are also
# tested after merges. workflow_dispatch: run on any branch by hand.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes; runs on main and
# develop are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.python-version }} - Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
    - uses: actions/checkout@v6

    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install ArcaNN
      run: uv sync --locked --dev

    - name: Run unit tests
      run: |
        uv run python -m unittest discover arcann_training/unittests
